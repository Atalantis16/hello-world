<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello, World! · GitHub Pages 部署演示</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e1116'/%3E%3Cpath d='M9 10l7 6-7 6' fill='none' stroke='%23d8a05e' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cline x1='18' y1='22' x2='24' y2='22' stroke='%23d8a05e' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0e1116;
    --bg-soft:#141a22;
    --panel:#11161d;
    --ink:#e8e4db;
    --ink-dim:#9aa3b0;
    --amber:#d8a05e;
    --amber-soft:rgba(216,160,94,.14);
    --line:rgba(232,228,219,.12);
    --green:#8fbf8a;
    --mono:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:var(--sans);
    color:var(--ink);
    background:
      radial-gradient(900px 500px at 78% -10%, rgba(216,160,94,.10), transparent 60%),
      radial-gradient(700px 500px at 8% 110%, rgba(120,150,180,.08), transparent 60%),
      var(--bg);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:48px 20px 32px;
  }
  .wrap{width:100%;max-width:720px;}

  /* ===== 顶部标识 ===== */
  .masthead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px;}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:14px;letter-spacing:.2px;color:var(--ink);}
  .brand svg{flex:none;}
  .live{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px;color:var(--ink-dim);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(143,191,138,.6);animation:pulse 2.4s ease-out infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(143,191,138,.5);}70%{box-shadow:0 0 0 9px rgba(143,191,138,0);}100%{box-shadow:0 0 0 0 rgba(143,191,138,0);}}

  /* ===== 终端窗口 ===== */
  .terminal{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 24px 60px -28px rgba(0,0,0,.75);
  }
  .term-bar{
    display:flex;align-items:center;gap:8px;
    padding:12px 16px;
    background:var(--bg-soft);
    border-bottom:1px solid var(--line);
  }
  .traffic{display:flex;gap:7px;}
  .traffic i{width:11px;height:11px;border-radius:50%;display:block;}
  .traffic i:nth-child(1){background:#e06a5e;}
  .traffic i:nth-child(2){background:#e0b85a;}
  .traffic i:nth-child(3){background:#7cc07c;}
  .term-file{margin-left:10px;font-family:var(--mono);font-size:12.5px;color:var(--ink-dim);}
  .term-body{padding:26px 22px 30px;}
  .cmd{font-family:var(--mono);font-size:14px;color:var(--ink-dim);margin:0 0 18px;word-break:break-all;}
  .cmd .prompt{color:var(--amber);margin-right:9px;}
  .hello{
    font-family:var(--mono);
    font-size:clamp(26px,6vw,40px);
    line-height:1.25;
    font-weight:700;
    color:var(--ink);
    margin:0;
    min-height:1.25em;
    letter-spacing:-.5px;
  }
  .cursor{display:inline-block;width:.55ch;background:var(--amber);margin-left:2px;animation:blink 1.05s step-end infinite;}
  @keyframes blink{50%{opacity:0;}}

  /* ===== 说明 ===== */
  .lede{margin:26px 0 0;font-size:15.5px;color:var(--ink-dim);max-width:56ch;}
  .lede strong{color:var(--ink);font-weight:600;}

  /* ===== 状态面板 ===== */
  .stats{
    display:grid;grid-template-columns:1fr;gap:1px;
    margin-top:26px;border:1px solid var(--line);border-radius:12px;overflow:hidden;
    background:var(--line);
  }
  .stat{background:var(--panel);padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;}
  .stat .k{font-size:13.5px;color:var(--ink-dim);}
  .stat .v{font-family:var(--mono);font-size:13.5px;color:var(--ink);text-align:right;}
  .stat .v.accent{color:var(--amber);}
  @media (min-width:600px){
    .stats{grid-template-columns:repeat(3,1fr);}
    .stat{flex-direction:column;align-items:flex-start;gap:6px;}
    .stat .v{text-align:left;}
  }

  /* ===== 操作 ===== */
  .actions{margin-top:26px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
  button{
    appearance:none;border:1px solid var(--amber);
    background:var(--amber-soft);color:var(--amber);
    font-family:var(--mono);font-size:14px;
    padding:11px 18px;border-radius:9px;cursor:pointer;
    transition:background .18s ease, transform .12s ease;
  }
  button:hover{background:rgba(216,160,94,.24);}
  button:active{transform:translateY(1px);}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .lang-hint{font-family:var(--mono);font-size:12.5px;color:var(--ink-dim);}

  footer{margin-top:34px;padding-top:20px;border-top:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--ink-dim);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}

  @media (prefers-reduced-motion:reduce){
    .dot{animation:none;}
    .cursor{animation:none;}
    *{transition:none !important;}
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="masthead">
      <div class="brand">
        <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#11161d" stroke="rgba(232,228,219,.18)"/><path d="M9 10l7 6-7 6" fill="none" stroke="#d8a05e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="18" y1="22" x2="24" y2="22" stroke="#d8a05e" stroke-width="2.6" stroke-linecap="round"/></svg>
        <span>hello-world</span>
      </div>
      <span class="live"><span class="dot"></span>站点在线 · 公网可访问</span>
    </div>

    <section class="terminal" aria-label="终端演示">
      <div class="term-bar">
        <span class="traffic"><i></i><i></i><i></i></span>
        <span class="term-file">~/pages/hello-world — zsh</span>
      </div>
      <div class="term-body">
        <p class="cmd"><span class="prompt">$</span>hello-world --deploy</p>
        <h1 class="hello"><span id="typed"></span><span class="cursor">&nbsp;</span></h1>
      </div>
    </section>

    <p class="lede">这是一个静态网页，已通过 <strong>GitHub Pages</strong> 托管并发布到公网。页面由单个 HTML 文件构成，无需服务器，任何设备通过浏览器即可访问。</p>

    <section class="stats" aria-label="部署信息">
      <div class="stat"><span class="k">运行状态</span><span class="v accent" id="net">在线</span></div>
      <div class="stat"><span class="k">托管平台</span><span class="v">GitHub Pages</span></div>
      <div class="stat"><span class="k">本地时间</span><span class="v" id="clock">--:--:--</span></div>
    </section>

    <div class="actions">
      <button id="greet" type="button">换一种问候</button>
      <span class="lang-hint" id="langHint">当前语言：English</span>
    </div>

    <footer>
      <span>status: deployed</span>
      <span id="footUrl"></span>
    </footer>
  </main>

<script>
(function(){
  var greetings = [
    {lang:"English",   text:"Hello, World!"},
    {lang:"简体中文",  text:"你好，世界！"},
    {lang:"日本語",    text:"こんにちは、世界！"},
    {lang:"Français",  text:"Bonjour, le monde !"},
    {lang:"Español",   text:"¡Hola, mundo!"},
    {lang:"Deutsch",   text:"Hallo, Welt!"},
    {lang:"Русский",   text:"Привет, мир!"},
    {lang:"العربية",  text:"مرحبا بالعالم!"}
  ];
  var idx = 0;
  var typedEl = document.getElementById("typed");
  var hintEl = document.getElementById("langHint");
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var timer = null;

  function typeText(text, done){
    if(timer){clearTimeout(timer);timer=null;}
    if(reduceMotion){typedEl.textContent = text; if(done)done(); return;}
    var n = 0;
    typedEl.textContent = "";
    function step(){
      if(n <= text.length){
        typedEl.textContent = text.slice(0,n);
        n++;
        timer = setTimeout(step, text.length > 20 ? 42 : 62);
      } else if(done){ done(); }
    }
    step();
  }

  function render(i){
    var g = greetings[i];
    hintEl.textContent = "当前语言：" + g.lang;
    typeText(g.text);
  }

  document.getElementById("greet").addEventListener("click", function(){
    idx = (idx + 1) % greetings.length;
    render(idx);
  });

  // 实时时钟
  var clockEl = document.getElementById("clock");
  function tick(){
    var d = new Date();
    function p(x){return (x<10?"0":"")+x;}
    clockEl.textContent = p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
  }
  tick(); setInterval(tick,1000);

  // 在线状态
  var netEl = document.getElementById("net");
  function syncNet(){ netEl.textContent = navigator.onLine ? "在线" : "离线"; netEl.className = "v" + (navigator.onLine ? " accent" : ""); }
  window.addEventListener("online", syncNet);
  window.addEventListener("offline", syncNet);
  syncNet();

  document.getElementById("footUrl").textContent = window.location.hostname;

  // 首次打字机入场
  typeText(greetings[0].text);
})();
</script>
</body>
</html>
